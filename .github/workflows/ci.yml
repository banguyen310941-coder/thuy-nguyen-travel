name: Verify HappyGo Travel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happygo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production regression checks
        run: npm run test:regression

      - name: CTV / Affiliate regression checks
        run: npm run test:affiliate

      - name: SEO regression checks
        run: npm run test:seo

      - name: Build Next.js
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Rendered Admin PWA smoke test
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: node scripts/admin-built-pwa-regression.mjs
